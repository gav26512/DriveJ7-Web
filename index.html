<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Drive J7</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="theme-dark">

  <!-- ============================== Wallpaper layer (Bing daily) -->
  <div id="wallpaper" class="wallpaper"></div>

  <!-- Плавающие виджеты — каждый позиционируется независимо. Long-press 350ms       -->
  <!-- начинает drag, позиция сохраняется в localStorage 'widget-pos.<id>'.          -->
  <div id="ov-datetime" class="ov-widget ov-datetime" data-widget-id="datetime">
    <div id="ov-time">--:--</div>
    <div id="ov-date">—</div>
  </div>
  <div id="ov-outdoor" class="ov-widget ov-pill" data-widget-id="outdoor">--°</div>
  <div id="ov-wifi" class="ov-widget ov-pill" data-widget-id="wifi" style="display:none">
    <span class="wifi-icon">📶</span>
    <span class="wifi-label">WiFi</span>
  </div>
  <!-- RPM-виджет скрыт. Раскомментировать когда понадобится. -->
  <!-- <div id="ov-rpm" class="ov-widget ov-pill" data-widget-id="rpm">---- <span class="ov-pill-unit">RPM</span></div> -->

  <!-- ============================== Bottom panel -->
  <!-- Структура: Row[ AppGrid 2×3 + Player ] над ClimateStrip                    -->
  <div id="bottom-panel">

    <div class="top-row">
      <!-- 6 app слотов в сетке 2 ряда × 3 колонки. Long-press → выбор приложения. -->
      <div class="app-grid" id="app-grid">
        <!-- слоты вставляются JS-ом -->
      </div>

      <!-- Music player block, занимает остаток ширины -->
      <div class="player-block" id="player-block">
        <div class="player-art" id="player-art">
          <div class="player-art-placeholder">♪</div>
        </div>
        <div class="player-info">
          <div class="player-title" id="player-title" data-i18n="music.no_track">Нет трека</div>
          <div class="player-artist" id="player-artist" data-i18n="music.unknown_artist">—</div>
        </div>
        <div class="player-controls">
          <button class="btn-vol" data-vol="down" aria-label="vol-">🔉</button>
          <button class="btn-media" data-cmd="MEDIA_PREV" aria-label="prev">⏮</button>
          <button class="btn-media btn-media-play" data-cmd="MEDIA_PLAY_PAUSE" aria-label="play/pause">▶</button>
          <button class="btn-media" data-cmd="MEDIA_NEXT" aria-label="next">⏭</button>
          <button class="btn-vol" data-vol="up" aria-label="vol+">🔊</button>
        </div>
        <div class="player-progress">
          <span class="player-time" id="player-pos">0:00</span>
          <div class="player-bar"><div class="player-bar-fill" id="player-bar"></div></div>
          <span class="player-time" id="player-dur">0:00</span>
        </div>
        <div class="player-extras">
          <button class="btn-bg" id="btn-bg-bing" title="Сменить обои">🖼</button>
          <button class="btn-bg" id="btn-bg-black" title="Чёрный фон">⬛</button>
        </div>
      </div>
    </div>

    <!-- ============================== Climate strip -->
    <div class="climate-strip" id="climate-strip">

      <!-- LEFT: T-stepper водителя -->
      <div class="t-stepper" id="t-driver-stepper">
        <button class="t-step-btn" data-step="driver_up" aria-label="T+">+</button>
        <div class="t-value">
          <div class="t-current" id="t-driver-value">22°</div>
        </div>
        <button class="t-step-btn" data-step="driver_down" aria-label="T-">−</button>
      </div>

      <!-- CENTER: HVAC button grid (2 rows × 6 cols) + fan-bar строкой ниже + memory  -->
      <div class="climate-center">
        <!-- Сетка HVAC-кнопок — рендерится из climate.js, поддерживает DnD -->
        <div class="hvac-grid" id="hvac-grid"></div>

        <!-- Fan + memory row под сеткой -->
        <div class="fan-mem-row">
          <span class="fan-label">MIN</span>
          <div class="fan-bar-inline">
            <button class="fan-edge" data-step="fan_down" aria-label="Fan-">−</button>
            <div class="fan-segments" id="fan-segments">
              <span></span><span></span><span></span><span></span><span></span>
              <span></span><span></span><span></span><span></span><span></span>
            </div>
            <button class="fan-edge" data-step="fan_up" aria-label="Fan+">+</button>
          </div>
          <span class="fan-label">MAX</span>
          <button class="mem-btn active" data-mem="1">В1</button>
          <button class="mem-btn" data-mem="2">В2</button>
          <button class="mem-btn" data-mem="3">В3</button>
          <button class="mem-btn config" id="btn-config" title="Настройки HVAC">⚙</button>
        </div>
      </div>

      <!-- RIGHT: T-stepper пассажира -->
      <div class="t-stepper" id="t-pass-stepper">
        <button class="t-step-btn" data-step="passenger_up" aria-label="T+">+</button>
        <div class="t-value">
          <div class="t-current" id="t-passenger-value">22°</div>
        </div>
        <button class="t-step-btn" data-step="passenger_down" aria-label="T-">−</button>
      </div>
    </div>
  </div>

  <!-- ============================== App picker dialog -->
  <div id="app-picker" class="overlay hidden">
    <div class="overlay-content">
      <header class="overlay-header">
        <h2>Выбор приложения</h2>
        <button id="picker-close" class="icon-btn" aria-label="close">✕</button>
      </header>
      <div id="app-picker-list" class="app-picker-list"></div>
    </div>
  </div>

  <!-- ============================== Settings overlay -->
  <div id="settings-overlay" class="overlay hidden">
    <div class="overlay-content">
      <header class="overlay-header">
        <h2 data-i18n="settings.title">Настройки</h2>
        <button id="settings-close" class="icon-btn" aria-label="close">✕</button>
      </header>
      <div class="settings-row">
        <label data-i18n="settings.language">Язык</label>
        <select id="setting-lang">
          <option value="ru">Русский</option>
          <option value="en">English</option>
        </select>
      </div>
      <div class="settings-row">
        <label data-i18n="settings.brightness">Яркость</label>
        <input type="range" id="setting-brightness" min="0" max="100" value="80">
      </div>
      <div class="settings-row settings-row-col">
        <label data-i18n="settings.accent">Подсветка</label>
        <div class="accent-palette" id="accent-palette">
          <button class="accent-swatch" data-accent="auto"    title="По профилю">A</button>
          <button class="accent-swatch" data-accent="#FFB55B" style="background:#FFB55B" title="Янтарь"></button>
          <button class="accent-swatch" data-accent="#CD7F32" style="background:#CD7F32" title="Бронзовый"></button>
          <button class="accent-swatch" data-accent="#D4AF37" style="background:#D4AF37" title="Золотой"></button>
          <button class="accent-swatch" data-accent="#FF5B5B" style="background:#FF5B5B" title="Красный"></button>
          <button class="accent-swatch" data-accent="#FFD93D" style="background:#FFD93D" title="Жёлтый"></button>
          <button class="accent-swatch" data-accent="#56E39F" style="background:#56E39F" title="Зелёный"></button>
          <button class="accent-swatch" data-accent="#4DD0E1" style="background:#4DD0E1" title="Бирюзовый"></button>
          <button class="accent-swatch" data-accent="#6CC8FF" style="background:#6CC8FF" title="Голубой"></button>
          <button class="accent-swatch" data-accent="#5B8DFF" style="background:#5B8DFF" title="Синий"></button>
          <button class="accent-swatch" data-accent="#A88BFF" style="background:#A88BFF" title="Сиреневый"></button>
          <button class="accent-swatch" data-accent="#FF6BD0" style="background:#FF6BD0" title="Розовый"></button>
        </div>
      </div>
      <div class="settings-row">
        <label data-i18n="settings.profile">Профиль машины</label>
        <select id="setting-profile">
          <option value="auto" data-i18n="settings.profile_auto">Автоопределение</option>
          <option value="j7">Jaecoo J7</option>
          <option value="j8">Jaecoo J8</option>
          <option value="tiggo9">Chery Tiggo 9</option>
          <option value="generic" data-i18n="settings.profile_generic">Generic</option>
        </select>
      </div>
      <div class="settings-row">
        <label data-i18n="settings.player">Плеер по умолчанию</label>
        <select id="setting-player">
          <option value="" data-i18n="settings.player_none">Не выбран</option>
          <!-- options заполняются JS-ом из playerDetect.detectInstalled() -->
        </select>
      </div>

      <div class="settings-section" data-i18n="settings.sec_widgets">Плавающие виджеты</div>
      <div class="settings-row">
        <label for="cfg-w-wifi" data-i18n="settings.w_wifi">WiFi</label>
        <input type="checkbox" id="cfg-w-wifi">
      </div>
      <div class="settings-row">
        <label for="cfg-w-dt" data-i18n="settings.w_dt">Дата и время</label>
        <input type="checkbox" id="cfg-w-dt" checked>
      </div>
      <div class="settings-row">
        <label for="cfg-w-temp" data-i18n="settings.w_temp">T за бортом</label>
        <input type="checkbox" id="cfg-w-temp" checked>
      </div>

      <div class="settings-section" data-i18n="settings.sec_climate">Кнопки климата</div>
      <div class="settings-row">
        <label for="cfg-two-zone" data-i18n="settings.two_zone">Двухзонный климат (T пасс.)</label>
        <input type="checkbox" id="cfg-two-zone" checked>
      </div>
      <div class="settings-row">
        <label for="cfg-auto" data-i18n="settings.auto_btn">AUTO</label>
        <input type="checkbox" id="cfg-auto" checked>
      </div>
      <div class="settings-row">
        <label for="cfg-recirc" data-i18n="settings.recirc_btn">Рециркуляция</label>
        <input type="checkbox" id="cfg-recirc" checked>
      </div>
      <div class="settings-row">
        <label for="cfg-front-glass" data-i18n="settings.front_glass">Обогрев лоб. стекла</label>
        <input type="checkbox" id="cfg-front-glass" checked>
      </div>
      <div class="settings-row">
        <label for="cfg-rear-glass" data-i18n="settings.rear_glass">Обогрев задн. стекла</label>
        <input type="checkbox" id="cfg-rear-glass" checked>
      </div>
      <div class="settings-row">
        <label for="cfg-steer-heat" data-i18n="settings.steer_heat">Подогрев руля</label>
        <input type="checkbox" id="cfg-steer-heat" checked>
      </div>
      <div class="settings-row">
        <label for="cfg-rear-seat" data-i18n="settings.rear_seat">Подогрев задних сидений</label>
        <input type="checkbox" id="cfg-rear-seat" checked>
      </div>
      <div class="settings-row">
        <label for="cfg-vent-drv" data-i18n="settings.vent_drv">Обдув сиденья (водитель)</label>
        <input type="checkbox" id="cfg-vent-drv" checked>
      </div>
      <div class="settings-row">
        <label for="cfg-vent-pass" data-i18n="settings.vent_pass">Обдув сиденья (пассажир)</label>
        <input type="checkbox" id="cfg-vent-pass" checked>
      </div>

      <div class="settings-section" data-i18n="settings.sec_memory">Память сидений водителя</div>
      <div class="settings-row">
        <label for="cfg-mem1">В1</label>
        <input type="checkbox" id="cfg-mem1" checked>
      </div>
      <div class="settings-row">
        <label for="cfg-mem2">В2</label>
        <input type="checkbox" id="cfg-mem2" checked>
      </div>
      <div class="settings-row">
        <label for="cfg-mem3">В3</label>
        <input type="checkbox" id="cfg-mem3" checked>
      </div>
      <div class="settings-row about" data-i18n="settings.about">О приложении</div>
      <div class="about-text">Drive J7 web · v0.2.0 · gav26512/DriveJ7-Web</div>
    </div>
  </div>

  <!-- ============================== Scripts -->
  <script src="js/api.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/config.js"></script>
  <script src="js/profiles/generic.js"></script>
  <script src="js/profiles/j7.js"></script>
  <script src="js/profiles/j8.js"></script>
  <script src="js/profiles/tiggo9.js"></script>
  <script src="js/profile-loader.js"></script>
  <script src="js/wallpaper.js"></script>
  <script src="js/overlay-info.js"></script>
  <script src="js/widget-drag.js"></script>
  <script src="js/apps.js"></script>
  <script src="js/player-detect.js"></script>
  <script src="js/music.js"></script>
  <script src="js/dnd.js"></script>
  <script src="js/climate.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/core.js"></script>
</body>
</html>
